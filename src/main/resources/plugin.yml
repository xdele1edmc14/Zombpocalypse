name: Zombpocalypse
main: com.deleted.zombpocalypse.Zombpocalypse
version: "1.4.6-BETA"
api-version: 1.21
authors: [xDele1ed]
description: A hardcore zombie horde plugin with advanced AI, Blood Moons, and GriefPrevention support.

softdepend: [GriefPrevention, MythicMobs]

commands:
  zreload:
    description: Reloads Zombpocalypse configuration
    usage: /zreload
    permission: zombpocalypse.admin
  zitem:
    description: Gives special plugin items
    usage: /zitem <item> [player]
    permission: zombpocalypse.admin
  forcebloodmoon:
    description: Force a blood moon for a duration
    usage: /forcebloodmoon [minutes]
    permission: zombpocalypse.admin
    aliases: [fbm]
  stopbloodmoon:
    description: Stop an active blood moon
    usage: /stopbloodmoon
    permission: zombpocalypse.admin
    aliases: [sbm]
  zspawn:
    description: Spawn zombies or hordes
    usage: /zspawn <type|horde> [count] [radius]
    permission: zombpocalypse.command.zspawn
  help:
    description: Show Zombpocalypse help
    usage: /help

permissions:
  zombpocalypse.admin:
    description: Access to all admin commands
    default: op
  zombpocalypse.command.zspawn:
    description: Ability to spawn custom zombies
    default: op
